<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>运转动效核对</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        background: #0b1220;
        color: #dce8ee;
        font: 13px/1.6 Consolas, "Courier New", monospace;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 4px;
      }
      p.lead {
        margin: 0 0 14px;
        color: rgba(220, 232, 238, 0.7);
      }
      #stage {
        background: #0b1220;
        background-image:
          linear-gradient(rgba(120, 160, 180, 0.09) 1px, transparent 1px),
          linear-gradient(90deg, rgba(120, 160, 180, 0.09) 1px, transparent 1px);
        background-size: 20px 20px;
        display: inline-block;
        border: 1px solid rgba(120, 160, 180, 0.2);
      }
      #geo {
        margin-top: 16px;
        padding: 12px;
        white-space: pre;
        border: 1px solid rgba(120, 160, 180, 0.25);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.03);
        color: #b9d6cf;
      }
    </style>
  </head>
  <body>
    <h1>运转动效核对（真实模块 + Konva 实际绘制）</h1>
    <p class="lead">
      虚线框 = 图形区 contain 矩形；粉色点 = 旋转中心。第 1 格采煤机把**未挖取的原始素材图**（洋红，半透明）叠在挖取后的版本上，滚筒对不齐就会看成重影；第 2 行是同一台设备的 2.5D 风格（线条稿应无差异）；第 3 行是停机色；第 4、5 行是掘进机截割头与皮带带面。
    </p>
    <div id="stage"></div>
    <pre id="geo">(计算中…)</pre>
    <!--
      本页用 dev server 直接编译 TS 入口（不再预打包 bundle，避免打包器不在依赖里时过期腐坏）：
        npx vite --port 5180 --strictPort
        打开 http://127.0.0.1:5180/design/probe/motion.html
    -->
    <script type="module" src="./motion-entry.ts"></script>
  </body>
</html>
