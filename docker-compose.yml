# 一条命令起全站：前端（Nginx 托管 dist）+ 存储后端（Node）
#
#   docker compose up -d --build
#   # 浏览器打开 http://localhost:8080
#
# 数据都在 scada-data 卷里（账号、工程、时序历史），重建容器不丢。
#
# server 只能是 1 个副本：它按 DATA_DIR 抢单实例锁（docs/DEPLOY.md §5.6），
# 多副本共用 scada-data 卷时后来者会直接拒绝启动。要横向扩展请先换数据库。
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      PORT: 5174
      # 容器内必须监听全网卡，否则宿主机访问不到（默认 127.0.0.1 只认容器内）
      HOST: 0.0.0.0
      DATA_DIR: /data
      HISTORY_RETENTION_DAYS: 30
      # 同域反代（默认用法）不需要跨域；若前端在别的域名，改成该站点
      CORS_ORIGIN: http://localhost:8080
      # 可选服务主密钥（探针/CI 用）。日常访问走登录会话，不建议设置
      # AUTH_TOKEN: change-me
    volumes:
      - scada-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  scada-data:
